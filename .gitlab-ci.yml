# Деплой Terminal приложения
deploy_terminal:
  stage: deploy
  image: alpine:latest
  dependencies: [build_terminal]

  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    # Создаем временный файл для ключа
    - echo "$SSH_PRIVATE_KEY" > /tmp/ssh_key
    - echo "==== SSH KEY BEGIN ===="
    - cat /tmp/ssh_key
    - echo "==== SSH KEY END ===="
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - rm /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - echo "🚀 Деплой Terminal (3029)"
    - echo $DEPLOY_USER
    - echo $DEPLOY_HOST
    - echo $DEPLOY_PATH
    # 1. создаём каталог на сервере
    - ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH/terminal/.next"
    # 2. синхронизация
    - rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
      apps/compass-terminal/.next/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/terminal/.next/"
    - rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
      apps/compass-terminal/public/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/terminal/public/"
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
      apps/compass-terminal/.env.production "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/terminal/"
    # 3. перезапуск PM2
    - ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
      "cd $DEPLOY_PATH/terminal && pm2 restart compass-terminal || pm2 start npm --name compass-terminal -- start"
    - echo "✅ Terminal задеплоен"

# Деплой всех приложений одновременно
deploy_all:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_admin
    - build_driver
    - build_terminal
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    # Создаем временный файл для ключа
    - echo "$SSH_PRIVATE_KEY" > /tmp/ssh_key
    - echo "==== SSH KEY BEGIN ===="
    - cat /tmp/ssh_key
    - echo "==== SSH KEY END ===="
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - rm /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Деплой всех приложений Compass 2.0"
    - echo "Синхронизация Admin..."
    - rsync -avz --delete apps/compass-admin/.next/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/.next/
    - rsync -avz --delete apps/compass-admin/public/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/public/
    - rsync -avz apps/compass-admin/.env.production $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/
    - echo "Синхронизация Driver..."
    - rsync -avz --delete apps/compass-driver/.next/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/driver/.next/
    - rsync -avz --delete apps/compass-driver/public/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/driver/public/
    - rsync -avz apps/compass-driver/.env.production $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/driver/
    - echo "Синхронизация Terminal..."
    - rsync -avz --delete apps/compass-terminal/.next/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/terminal/.next/
    - rsync -avz --delete apps/compass-terminal/public/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/terminal/public/
    - rsync -avz apps/compass-terminal/.env.production $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/terminal/
    - echo "Перезапуск всех PM2 процессов..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "pm2 restart compass-admin compass-driver compass-terminal || echo 'Некоторые процессы не найдены'"
    - echo "✅ Все приложения задеплоены"
  environment:
    name: production-all
  only:
    - main
  when: manual

# Очистка кэша (ручной запуск)
cleanup_cache:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🧹 Очистка кэша CI/CD"
    - rm -rf node_modules/ .yarn-cache/ .next/cache/
    - echo "✅ Кэш очищен"
  when: manual
  only:
    - main
