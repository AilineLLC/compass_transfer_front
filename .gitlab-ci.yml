stages:
  - install
  - build
  - deploy

variables:
  NODE_VERSION: '20'

# Кэширование для ускорения сборки
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .yarn/cache/
    - .next/cache/

# Установка зависимостей (только при изменении package.json/yarn.lock или ручной запуск)
install_dependencies:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - echo "📦 Установка зависимостей"
    - echo "Yarn версия:" && yarn --version
    - yarn install --frozen-lockfile
    - echo "✅ Зависимости установлены"
  artifacts:
    paths:
      - node_modules/
    expire_in: 24 hours
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && ($CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "develop")
      when: manual
      allow_failure: false
    - if: $CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "develop"
      changes:
        - package.json
        - yarn.lock
        - packages/*/package.json
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "develop"
      when: manual
      allow_failure: true

# Сборка Admin приложения (порт 3027)
build_admin:
  stage: build
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - install_dependencies
  before_script:
    - |
      if [ ! -d "node_modules" ]; then
        echo "📦 node_modules не найден, устанавливаем зависимости..."
        yarn install --frozen-lockfile
      else
        echo "✅ Используем кэшированные зависимости"
      fi
  variables:
    APP_VERSION: '1.0.0'
    NODE_ENV: 'production'
    HOSTNAME: 'compass.local'
    PORT: '3027'
    NEXT_PUBLIC_API_URL: 'https://api.compasstransfer.kg'
    NEXT_PUBLIC_DOMAIN: '.compasstransfer.kg'
    AUTH_COOKIE_NAME: '.AspNetCore.Identity.Application'
    NEXT_PUBLIC_WS_BASE_URL: 'wss://api.compasstransfer.kg/hubs/wshub'
  script:
    - echo "🏗️ Сборка Admin приложения (порт 3027)"
    - cd apps/compass-admin
    - echo "Создание .env.production файла..."
    - |
      cat > .env.production << EOF
      APP_VERSION=$APP_VERSION
      NODE_ENV=$NODE_ENV
      HOSTNAME=$HOSTNAME
      PORT=$PORT
      NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      NEXT_PUBLIC_DOMAIN=$NEXT_PUBLIC_DOMAIN
      AUTH_COOKIE_NAME=$AUTH_COOKIE_NAME
      NEXT_PUBLIC_WS_BASE_URL=$NEXT_PUBLIC_WS_BASE_URL
      EOF
    - echo "Environment файл создан:"
    - cat .env.production
    - yarn build
    - echo "✅ Admin приложение собрано"
  artifacts:
    paths:
      - apps/compass-admin/.next/
      - apps/compass-admin/.env.production
    expire_in: 1 day
  only:
    - main
    - develop

