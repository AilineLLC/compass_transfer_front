# Деплой Admin приложения
deploy_admin:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_admin
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    # Создаем временный файл для ключа
    - echo "$SSH_PRIVATE_KEY" > /tmp/ssh_key
    - echo "==== SSH KEY BEGIN ===="
    - cat /tmp/ssh_key
    - echo "==== SSH KEY END ===="
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - rm /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Деплой Admin приложения (порт 3027)"
    - echo "Синхронизация файлов..."
    - rsync -avz --delete apps/compass-admin/.next/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/.next/
    - rsync -avz --delete apps/compass-admin/public/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/public/
    - rsync -avz apps/compass-admin/.env.production $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/
    - echo "Перезапуск PM2 процесса..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH/admin && pm2 restart compass-admin || pm2 start npm --name compass-admin -- start"
    - echo "✅ Admin приложение задеплоено на порт 3027"
  environment:
    name: production-admin
    url: https://compasstransfer.kg
  only:
    - main
  when: manual

