name: Deploy Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            cd /home/compass/compass-staging
            
            # 2. Обновляем данные о ветках
            git fetch --all
            
            # 3. Сбрасываем текущую ветку на актуальный staging
            git reset --hard origin/staging 

            # 4. КОСТЫЛЬ: Если файла всё еще нет (потому что он в main), забираем его принудительно
            if [ ! -f "docker/docker-compose-staging.yml" ]; then
              echo "File not found in staging branch, trying to pull from main..."
              git checkout origin/main -- docker/docker-compose-staging.yml
            fi

            # 5. Экспортируем порты
            export STAGING_PORT_ADMIN=4027
            export STAGING_PORT_DRIVER=4028
            export STAGING_PORT_TERMINAL=4029
            export STAGING_PORT_LANDING=4026
            export NEXT_PUBLIC_API_URL="https://compass.ailine.kg/api"

            # 6. Запуск Docker с префиксом проекта, чтобы не задеть Прод
            # Проверяем наличие файла еще раз перед запуском
            ls -la docker/docker-compose-staging.yml

            docker compose -f docker/docker-compose.staging.yml run --rm compass-install
            docker compose -f docker/docker-compose.staging.yml up -d --build --force-recreate --remove-orphans
