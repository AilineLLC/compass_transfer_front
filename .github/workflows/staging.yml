name: Deploy Staging

on:
  push:
    branches: [ "staging" ] # Деплоим при пуше в staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            # 1. Подготовка директории
            mkdir -p /home/compass/compass-staging
            cd /home/compass/compass-staging

            # 2. Проверка репозитория (исправляем ошибку "destination path '.' already exists")
            if [ ! -d ".git" ]; then
              echo "Creating fresh clone..."
              find . -mindepth 1 -delete # Удаляем всё, кроме самой папки, чтобы clone прошел в '.'
              git clone https://github.com/ВАШ_РЕПО/compass.git .
            fi

            # 3. Обновление кода
            git fetch --all
            git reset --hard origin/staging 

            # 4. Переменные окружения для Docker (Порты и API)
            export STAGING_PORT_ADMIN=4027
            export STAGING_PORT_DRIVER=4028
            export STAGING_PORT_TERMINAL=4029
            export STAGING_PORT_LANDING=4026
            export NEXT_PUBLIC_API_URL="https://compass.ailine.kg/api"

            # 5
