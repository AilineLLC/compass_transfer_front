name: Deploy Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/compass/compass-staging
            
            # 1. Обновляем код
            git fetch --all
            git reset --hard origin/staging

            # 2. Установка зависимостей (используем ваш .env на сервере)
            # Флаг --env-file указывает докеру брать переменные из вашего готового файла
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.yml run --rm compass-install npm install --legacy-peer-deps

            # 3. Сборка фронтенда
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.yml run --rm compass-admin-build
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.yml run --rm compass-driver-build
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.yml run --rm compass-terminal-build

            # 4. Запуск стейджинга
            # --force-recreate обновит контейнеры с новыми переменными из вашего .env
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.yml up -d --force-recreate --remove-orphans
