name: Deploy Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/compass/compass-staging
            
            git fetch --all
            git reset --hard origin/staging 

            # Удаляем старый package-lock если он есть, так как мы работаем с yarn
            rm -f package-lock.json

            # 1. Установка зависимостей через YARN
            # Явно вызываем yarn внутри контейнера
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.staging.yml run --rm compass-install yarn install

            # 2. Сборка (убедитесь, что команды build в package.json вызываются через yarn)
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.staging.yml run --rm compass-admin-build
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.staging.yml run --rm compass-driver-build
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.staging.yml run --rm compass-terminal-build

            # 3. Запуск сервисов
            docker compose -p compass-staging --env-file .env -f docker/docker-compose.staging.yml up -d --build --force-recreate --remove-orphans
