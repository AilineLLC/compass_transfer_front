name: Deploy Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            
            git fetch --all
            git reset --hard origin/staging 

            # 4. Переменные
            export STAGING_PORT_ADMIN=4027
            export STAGING_PORT_DRIVER=4028
            export STAGING_PORT_TERMINAL=4029
            export STAGING_PORT_LANDING=4026

            # 5. Запуск Docker
            docker compose -f docker/docker-compose-staging.yml run --rm compass-install
            docker compose -f docker/docker-compose-staging.yml up -d --build --force-recreate --remove-orphans
