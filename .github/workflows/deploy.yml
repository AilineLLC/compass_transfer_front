name: Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/compass/compass-frontend
          
            git fetch --all
            git reset --hard origin/main
          
            docker compose -p compass-frontend -f docker/docker-compose.yml run --rm compass-install
            docker compose -p compass-frontend -f docker/docker-compose.yml run --rm compass-admin-build
            docker compose -p compass-frontend -f docker/docker-compose.yml run --rm compass-driver-build
            docker compose -p compass-frontend -f docker/docker-compose.yml run --rm compass-terminal-build
          
            docker compose -p compass-frontend -f docker/docker-compose.yml up -d --force-recreate --remove-orphans
