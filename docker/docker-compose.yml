name: compass-frontend

services:
  compass-install:
    image: node:20-alpine3.19
    working_dir: /app
    container_name: compass_install
    volumes:
      - ../:/app
    environment:
      NODE_ENV: production
    command: >
      sh -c "yarn install"
    restart: "no"
    profiles: ["ops"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - compass-network

  compass-admin-build:
    image: node:20-alpine3.19
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
    env_file:
      - ../apps/compass-admin/.env.production
    command: >
      sh -c "yarn build:admin"
    restart: "no"
    profiles: ["ops"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    networks:
      - compass-network

  compass-driver-build:
    image: node:20-alpine3.19
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
    env_file:
      - ../apps/compass-driver/.env.production
    command: >
      sh -c "yarn build:driver-mobile"
    restart: "no"
    profiles: ["ops"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 6g
    networks:
      - compass-network

  compass-terminal-build:
    image: node:20-alpine3.19
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
    env_file:
      - ../apps/compass-terminal/.env.production
    command: >
      sh -c "yarn build:terminal"
    restart: "no"
    profiles: ["ops"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    mem_limit: 6g
    networks:
      - compass-network

  compass-admin:
    image: node:20-alpine3.19
    working_dir: /app
    restart: always
    volumes:
      - ../:/app
    ports:
      - "3027:3027"
    environment:
      NODE_ENV: production
    env_file:
      - ../apps/compass-admin/.env.production
    command: >
      sh -c "yarn start:admin"
    networks:
      - compass-network

  compass-driver:
    image: node:20-alpine3.19
    working_dir: /app
    restart: always
    volumes:
      - ../:/app
    ports:
      - "3028:3028"
    environment:
      NODE_ENV: production
    env_file:
      - ../apps/compass-driver/.env.production
    command: >
      sh -c "yarn start:driver-mobile"
    networks:
      - compass-network

  compass-terminal:
    image: node:20-alpine3.19
    working_dir: /app
    restart: always
    volumes:
      - ../:/app
    ports:
      - "3029:3029"
    environment:
      NODE_ENV: production
    env_file:
      - ../apps/compass-terminal/.env.production
    command: >
      sh -c "yarn start:terminal"
    networks:
      - compass-network

networks:
  compass-network:
    name: compass_default
    external: true
